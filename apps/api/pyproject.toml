[tool.poetry]
name = "switchpilot-api"
version = "1.0.0"
description = "SwitchPilot - Multi-Vendor Network Automation FastAPI Backend"
authors = ["SwitchPilot Core Architecture Team <architecture@switchpilot.io>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
asyncpg = "^0.29.0"
redis = "^5.0.0"
celery = "^5.4.0"
paramiko = "^3.4.0"
netmiko = "^4.3.0"
scrapli = "^2024.1.30"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
black = "^24.4.0"
isort = "^5.13.0"
mypy = "^1.10.0"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
